<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ☕ Aurora Café </title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
</head>
<body>
    <header class="cabecalho">
            <div class="logo-header">
                <h1> Aurora Café </h1>
                
            </div>
            <div class="menu-meio">
                <nav class="menu">
                    <a href="index.html">Início</a>
                    <a href="#cardapio">Menu</a>
                    <a href="sobre">Sobre</a>
                    <a href="#contato">Contato</a>
                </nav>
            </div>
            <div class="menu-direito">
                <h2>🔍</h2>
                <h2>👤</h2>
                <a href="#pedidos">
                    <h2>🛒</h2>
                </a>
            </div>

    </header>

    <main>

        <section class="destaque">
            <div class="texto-destaque">
                <h1>O seu momento,<br> <span class="caramelo">mais especial</span> <br>começa aqui.</h1>
                <p>Cafés selecionados, sabores únicos e<br> um ambiente feito para você.</p>
            </div>
            <div class="botoes">
                <a href="#menu">
                    <button class="bt-menu">Ver Menu</button>
                </a>
                <a href="#pedidos">
                    <button class="bt-pedido">Fazer pedido</button>
                </a> 
                <div class="destaque-img">
                    
                </div>

            </div>

        </section>

        <section id="cardapio">
            <div class="texto-cardapio">
                <h1>Nosso Menu</h1>
                <p>Escolha seus FAVORITOS!</p>
            </div>
                <div class="tabs">
                    <input type="radio" name="cardapio" id="todos" checked>
                    <input type="radio" name="cardapio" id="cafe">
                    <input type="radio" name="cardapio" id="bebidas">
                    <input type="radio" name="cardapio" id="doces">
                    <input type="radio" name="cardapio" id="salgados">
                
                <div class="bt-labels">
                    <label for="todos">Todos</label>
                    <label for="cafe">Café</label>
                    <label for="bebidas">Bebidas</label>
                    <label for="doces">Doces</label>
                    <label for="salgados">Salgados</label>
                </div>

                <div class="content" id="content-todos">

                </div>
                <div class="content" id="content-cafe">
                    <h3>Espresso Tradicional</h3>
                    <p>Café espresso preparado com grãos selecionados e torra equilibrada.</p>
                    <h4>R$ 6,00</h4>
                    
                </div>
                <div class="content" id="content-bebidas">
                    
                </div>
                <div class="content" id="content-doces">
                    
                </div>
                <div class="content" id="content-salgados">
                    
                </div>
            </div>
        </section>

    </main>

    <footer>

    </footer>
    
</body>
</html>
